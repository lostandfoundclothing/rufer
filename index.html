<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rufhr</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      text-align: center;
    }
    .picture {
      width: min(420px, 85vw);
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,.15);
      background: white;
    }
    .picture svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    h1 {
      margin: 22px 0 0;
      font-size: clamp(40px, 8vw, 72px);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="picture" aria-label="Simple landscape picture">
      <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7ec8ff"/>
            <stop offset="100%" stop-color="#dff3ff"/>
          </linearGradient>
        </defs>
        <rect width="800" height="600" fill="url(#sky)"/>
        <circle cx="650" cy="120" r="65" fill="#ffd95a"/>
        <path d="M0 420 L210 210 L360 380 L500 260 L800 500 L800 600 L0 600 Z" fill="#6d8f64"/>
        <path d="M0 490 L170 350 L320 470 L470 390 L800 540 L800 600 L0 600 Z" fill="#416b4a"/>
      </svg>
    </div>
    <h1>rufhr</h1>
  </main>
</body>
</html>
