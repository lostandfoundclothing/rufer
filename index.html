<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rufhr</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      text-align: center;
    }
    .picture {
      width: min(420px, 85vw);
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,.15);
      background: white;
    }
    .picture img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    h1 {
      margin: 22px 0 0;
      font-size: clamp(40px, 8vw, 72px);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="picture">
      <img src="image0.jpg" alt="Picture" />
    </div>
    <h1>rufhr</h1>
  </main>
</body>
</html>
